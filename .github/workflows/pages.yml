name: Publish Sylva

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v6
      - name: Assemble and verify the complete website
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, io, json, zipfile
          manifest = json.loads(Path('.release/verify.json').read_text())
          packed = b''.join(p.read_bytes() for p in sorted(Path('.release').glob('assets.zip.part-*')))
          assert hashlib.sha256(packed).hexdigest() == manifest['archive_sha256'], 'Archive checksum failed'
          with zipfile.ZipFile(io.BytesIO(packed)) as archive:
              for name in archive.namelist():
                  assert not Path(name).is_absolute() and '..' not in Path(name).parts, 'Unsafe archive path'
              archive.extractall('dist')
          for record in manifest['files']:
              path = Path('dist') / record['path']
              assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest() == record['sha256'], f"Release checksum failed: {path}"
          print(f"Verified {len(manifest['files'])} public files.")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
